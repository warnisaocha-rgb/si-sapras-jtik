    let currentScreen = 1;
    let currentMobileTab = 'alat';

    function showScreen(num, submode) {
      currentScreen = num;
      if (num === 4 && submode) currentMobileTab = submode;

      const data = screens[num];
      document.getElementById('phoneInner').innerHTML = data.html;

      document.getElementById('screenMeta').innerHTML = `
        <span class="px-1.5 py-0.5 bg-white text-slate-900 font-bold text-[9px] uppercase">Layar 0${num}</span>
        <h3 class="font-bold text-sm text-white mt-1">${data.title}</h3>
        <span class="text-[10px] text-slate-400 block mb-2">PIC: ${data.pic}</span>
        <p class="text-[11px] text-slate-300">${data.desc}</p>
      `;

      document.querySelectorAll('.nav-pill').forEach(btn => {
        if (parseInt(btn.getAttribute('data-screen')) === num) {
          btn.className = 'nav-pill px-3 py-1 rounded font-bold bg-white text-slate-950';
        } else {
          btn.className = 'nav-pill px-3 py-1 rounded font-medium bg-slate-800 text-slate-400 hover:text-white';
        }
      });

      if (num === 4) switchMobileFormTab(currentMobileTab);
    }

    function switchMobileFormTab(tab) {
      currentMobileTab = tab;
      const pAlat = document.getElementById('mPanelAlat');
      const pBangku = document.getElementById('mPanelBangku');
      const bAlat = document.getElementById('mTabAlat');
      const bBangku = document.getElementById('mTabBangku');
      if (!pAlat || !pBangku) return;

      if (tab === 'bangku') {
        pAlat.classList.add('hidden');
        pBangku.classList.remove('hidden');
        if (bBangku) bBangku.className = 'px-2 py-0.5 border border-slate-800 bg-slate-900 text-white';
        if (bAlat) bAlat.className = 'px-2 py-0.5 border border-slate-800 bg-white text-slate-800';
      } else {
        pBangku.classList.add('hidden');
        pAlat.classList.remove('hidden');
        if (bAlat) bAlat.className = 'px-2 py-0.5 border border-slate-800 bg-slate-900 text-white';
        if (bBangku) bBangku.className = 'px-2 py-0.5 border border-slate-800 bg-white text-slate-800';
      }
    }

    function setMode(mode) {
      if (mode === 'device') {
        document.getElementById('deviceView').classList.remove('hidden');
        document.getElementById('gridView').classList.add('hidden');
        document.getElementById('screenNavPills').classList.remove('hidden');
        document.getElementById('btnDeviceMode').className = 'px-3 py-1.5 rounded font-bold bg-white text-slate-950 border border-white';
        document.getElementById('btnGridMode').className = 'px-3 py-1.5 rounded font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700';
        showScreen(currentScreen);
      } else {
        document.getElementById('deviceView').classList.add('hidden');
        document.getElementById('gridView').classList.remove('hidden');
        document.getElementById('screenNavPills').classList.add('hidden');
        document.getElementById('btnDeviceMode').className = 'px-3 py-1.5 rounded font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700';
        document.getElementById('btnGridMode').className = 'px-3 py-1.5 rounded font-bold bg-white text-slate-950 border border-white';
        renderGrid();
      }
    }

    function renderGrid() {
      const container = document.getElementById('gridContainer');
      container.innerHTML = Object.keys(screens).map(key => {
        const s = screens[key];
        return `
          <div class="border-2 border-slate-700 bg-slate-950 p-2.5 rounded font-mono">
            <div class="flex justify-between items-center text-[10px] mb-1.5">
              <span class="text-white font-bold">${s.title}</span>
              <span class="text-slate-400">${s.pic}</span>
            </div>
            <div class="bg-white p-2.5 border-2 border-slate-800 text-slate-900 rounded-sm mb-2" style="min-height: 380px;">
              ${s.html}
            </div>
            <button onclick="setMode('device'); showScreen(${key});" class="w-full py-1 border border-slate-600 bg-slate-800 text-white text-[11px] hover:bg-slate-700">
              Buka di HP →
            </button>
          </div>
        `;
      }).join('');
    }

    // Init
    showScreen(1);
  </script>
</body>
</html>
