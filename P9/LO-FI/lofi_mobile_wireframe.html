      document.getElementById('phoneInner').innerHTML = data.html;

      // Update side meta
      document.getElementById('screenMeta').innerHTML = `

          <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-slate-700 text-slate-200">LAYAR 0${num}</span>

        </div>
        <h3 class="text-base font-bold text-white mb-1">${data.title}</h3>
        <p class="text-xs text-slate-300 mb-4 leading-relaxed">${data.desc}</p>
        
        <div class="space-y-1 text-xs text-slate-400 border-t border-slate-700 pt-3">
          <strong class="text-slate-200 block mb-1">Elemen Utama:</strong>
          ${data.points.map(p => `<div>• ${p}</div>`).join('')}
        </div>
      `;

      // Update nav pills
      document.querySelectorAll('.nav-pill').forEach(btn => {
        if (parseInt(btn.getAttribute('data-screen')) === num) {
          btn.className = 'nav-pill px-3 py-1.5 rounded-full font-medium transition bg-white text-slate-950';
        } else {
          btn.className = 'nav-pill px-3 py-1.5 rounded-full font-medium transition bg-slate-800 text-slate-400 hover:text-white';
        }
      });

      // Restore active tab on screen 4
      if (num === 4) {
        switchMobileFormTab(currentMobileTab);
      }
    }

    function switchMobileFormTab(tab) {
      currentMobileTab = tab;
      const pAlat = document.getElementById('mPanelAlat');
      const pBangku = document.getElementById('mPanelBangku');
      const bAlat = document.getElementById('mTabAlat');
      const bBangku = document.getElementById('mTabBangku');

      if (!pAlat || !pBangku) return;

      if (tab === 'bangku') {
        pAlat.classList.add('hidden');
        pBangku.classList.remove('hidden');
        if (bBangku) bBangku.className = 'px-2 py-1 rounded bg-slate-900 text-white font-bold transition';
        if (bAlat) bAlat.className = 'px-2 py-1 rounded text-slate-700 hover:text-slate-900 font-bold transition';
      } else {
        pBangku.classList.add('hidden');
        pAlat.classList.remove('hidden');
        if (bAlat) bAlat.className = 'px-2 py-1 rounded bg-slate-900 text-white font-bold transition';
        if (bBangku) bBangku.className = 'px-2 py-1 rounded text-slate-700 hover:text-slate-900 font-bold transition';
      }
    }

    function updateMobileRoomQuota() {
      const select = document.getElementById('mFormRuangAsal');
      const title = document.getElementById('mQuotaTitle');
      const desc = document.getElementById('mQuotaDesc');
      if (!select || !title || !desc) return;

      const val = select.value;
      if (val === 'tk02') {
        title.innerText = 'Ruang TK-02 (Surplus 42 B & 22 M)';
        desc.innerHTML = 'Batas aman kelas: 30 B & 15 M. Maksimal: <strong>12 bangku & 7 meja</strong> agar kelas reguler aman.';
      } else if (val === 'tk01') {
        title.innerText = 'Ruang TK-01 (Normal 35 B & 18 M)';
        desc.innerHTML = 'Batas aman kelas: 30 B & 15 M. Maksimal: <strong>5 bangku & 3 meja</strong> agar kelas reguler aman.';
      } else {
        title.innerText = 'Bengkel IT (25 K & 10 M)';
        desc.innerHTML = 'Batas cadangan: 15 K & 6 M. Maksimal: <strong>10 kursi & 4 meja</strong>.';
      }
    }

    function setMode(mode) {
      if (mode === 'device') {
        document.getElementById('deviceView').classList.remove('hidden');
        document.getElementById('gridView').classList.add('hidden');
        document.getElementById('screenNavPills').classList.remove('hidden');
        document.getElementById('btnDeviceMode').className = 'px-3 py-1 rounded-lg text-xs font-semibold bg-white text-slate-900 transition shadow';
        document.getElementById('btnGridMode').className = 'px-3 py-1 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition';
        showScreen(currentScreen);
      } else {
        document.getElementById('deviceView').classList.add('hidden');
        document.getElementById('gridView').classList.remove('hidden');
        document.getElementById('screenNavPills').classList.add('hidden');
        document.getElementById('btnDeviceMode').className = 'px-3 py-1 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition';
        document.getElementById('btnGridMode').className = 'px-3 py-1 rounded-lg text-xs font-semibold bg-white text-slate-900 transition shadow';

              Buka di Simulator HP →
