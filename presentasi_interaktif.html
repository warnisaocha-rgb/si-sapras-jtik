    * {

      user-select: none;
    }
    .font-display {
      font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;
    }

    /* Neo-Brutalism & Digitalisme Hard Shadows */
    .hard-shadow {
      box-shadow: 5px 5px 0px #0f172a;
    }
    .hard-shadow-sm {
      box-shadow: 3px 3px 0px #0f172a;
    }
    .hard-shadow-lg {
      box-shadow: 8px 8px 0px #0f172a;
    }

    /* Interactive Hover Lift */
    .sticker-hover {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sticker-hover:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 6px 6px 0px #0f172a;
    }

    /* Floating Sparkles */
    @keyframes floatSparkle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(10deg); }
    }
    .animate-sparkle {
      animation: floatSparkle 3s ease-in-out infinite;
    }

    /* Slide transition */
    .slide-enter {
      opacity: 0;
      transform: translateY(10px) scale(0.99);
    }
    .slide-active {
      opacity: 1;
      transform: translateY(0px) scale(1);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Dotted background */
    .bg-dot-pattern {
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 18px 18px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 8px;
    }

      border-radius: 8px;

    /* Fullscreen Mode: Hanya Layar PPT/Slide Mockup yang Tampil (Crop Bebas Elemen Luar) */

    // Web Audio Click sound
    let audioEnabled = true;
    const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
    function playTick() {
      if (!audioEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(650, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('soundOnIcon').classList.toggle('hidden', !audioEnabled);
      document.getElementById('soundOffIcon').classList.toggle('hidden', audioEnabled);

    function toggleFullScreen() {
      const vp = document.getElementById('slideViewport');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (vp.requestFullscreen) {
          vp.requestFullscreen().catch(() => {});
        } else if (vp.webkitRequestFullscreen) {
          vp.webkitRequestFullscreen();
        } else if (vp.msRequestFullscreen) {
          vp.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    let currentSlide = 0;

    let isEditMode = false;

    function showNotification(msg) {
      let toast = document.getElementById('liveToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'liveToast';
        toast.className = 'fixed bottom-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-slate-900 text-white border-2 border-[#FFDF00] hard-shadow-sm text-xs font-bold transition-all duration-300';
        document.body.appendChild(toast);
      }
      toast.innerText = msg;
      toast.style.opacity = '1';
      setTimeout(() => { if (toast) toast.style.opacity = '0'; }, 3500);
    }

    // Auto-clean obsolete caches from earlier testing so official proposal loads cleanly
    try {
      if (localStorage.getItem('sapras_proposal_synced_v4') !== 'true') {
        localStorage.clear();
        localStorage.setItem('sapras_proposal_synced_v4', 'true');
      }
    } catch(e) {}

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('editToggleBtn');
      const inner = document.getElementById('slideInner');
      
      if (isEditMode) {
        btn.innerHTML = '<span>💾 Simpan Teks</span>';
        btn.className = 'px-3 py-1 rounded-lg bg-[#22C55E] text-white border-2 border-slate-900 text-xs font-black transition hard-shadow-sm flex items-center space-x-1 animate-pulse';
        inner.contentEditable = "true";
        inner.classList.add('outline-dashed', 'outline-2', 'outline-pink-500');
        showNotification('✏️ Mode Edit Aktif! Klik langsung pada teks mana saja untuk mengetik/mengubah isinya.');
      } else {
        btn.innerHTML = '<span>✏️ Edit Teks</span>';
        btn.className = 'px-2.5 py-1 rounded-lg bg-[#FEF08A] hover:bg-[#FACC15] text-slate-950 border-2 border-slate-900 text-xs font-bold transition hard-shadow-sm flex items-center space-x-1';
        inner.contentEditable = "false";
        inner.classList.remove('outline-dashed', 'outline-2', 'outline-pink-500');
        try {
          localStorage.setItem('v3_slide_edit_' + currentSlide, inner.innerHTML);
        } catch(e) {}
        showNotification('✅ Perubahan teks berhasil disimpan!');
      }
    }

    function resetCurrentSlideText() {
      try {
        localStorage.removeItem('v3_slide_edit_' + currentSlide);
        localStorage.removeItem('saved_slide_custom_' + currentSlide);
      } catch(e) {}
      renderSlide(currentSlide);
      showNotification('↺ Teks slide dikembalikan ke isi asli proposal!');
    }

    function renderSlide(index) {
      const slide = slidesData[index];
      const container = document.getElementById('slideInner');
      
      document.getElementById('urlText').innerText = `https://${slide.url}`;
      document.getElementById('windowBadge').innerText = slide.badge;

      container.classList.remove('slide-active');
      container.classList.add('slide-enter');

      setTimeout(() => {
        // Check if user previously edited and saved this slide in current version
        const savedCustom = localStorage.getItem('v3_slide_edit_' + index);
        if (savedCustom) {
          container.innerHTML = savedCustom;
        } else {
          let headerHtml = '';
          // Jangan tampilkan header atas duplikat pada Slide 0 (Cover) karena Cover sudah punya hero title
          if (index > 0) {
            headerHtml = `
              <!-- Header Area Inside Browser Window -->
              <div class="mb-3 shrink-0">
                <span class="text-[10px] font-black px-2 py-0.5 rounded-full bg-[#E2E8F0] text-slate-800 border border-slate-900 tracking-wider inline-block mb-1.5 font-display">
                  ✦ ${slide.tag}
                </span>
                <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight font-display">${slide.title}</h2>
                <p class="text-xs text-slate-600 font-semibold mt-0.5">${slide.subtitle}</p>
              </div>
            `;
          }
          container.innerHTML = headerHtml + slide.content;
        }

        if (isEditMode) {
          container.contentEditable = "true";
          container.classList.add('outline-dashed', 'outline-2', 'outline-pink-500');
        } else {
          container.contentEditable = "false";
          container.classList.remove('outline-dashed', 'outline-2', 'outline-pink-500');
        }

        const progressPct = ((index + 1) / slidesData.length) * 100;
        document.getElementById('slideProgressBar').style.width = progressPct + '%';

        const padIndex = String(index + 1).padStart(2, '0');
        const padTotal = String(slidesData.length).padStart(2, '0');
        document.getElementById('slideCounterText').innerText = `${padIndex} / ${padTotal}`;
        const fsSlideEl = document.getElementById('fsSlideCounter');
        if (fsSlideEl) fsSlideEl.innerText = `${padIndex}/${padTotal}`;

        // Update tabs active state
        document.querySelectorAll('.tab-btn').forEach(btn => {
          const s = parseInt(btn.getAttribute('data-slide'));
          if (s === index) {
            btn.className = "tab-btn px-2.5 py-1 rounded-lg bg-[#FFDF00] text-slate-950 font-black border border-slate-900 shadow-sm transition";
          } else {
            btn.className = "tab-btn px-2.5 py-1 rounded-lg text-slate-600 hover:text-slate-950 hover:bg-slate-200 transition";
          }
        });

        container.classList.remove('slide-enter');
        container.classList.add('slide-active');
      }, 100);
    }

    function goToSlide(index) {
      if (index >= 0 && index < slidesData.length) {
        currentSlide = index;
        playTick();
        renderSlide(currentSlide);
      }
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        goToSlide(currentSlide + 1);
      } else {
        goToSlide(0);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        goToSlide(currentSlide - 1);
      }
    }

    window.addEventListener('keydown', (e) => {
      // JANGAN pindah slide jika sedang mode edit teks atau fokus di area ketikan!
      if (isEditMode || (document.activeElement && (document.activeElement.isContentEditable || document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA'))) {
        return;
      }
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullScreen();
      }
    });

    renderSlide(0);
  </script>
